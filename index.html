<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Simon</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h1 id="title">Press any key to start</h1>

        <div class="container">
            <div id="green" class="square green" type="button"></div>
            <div id="red" class="square red" type="button"></div>
            <div id="yellow" class="square yellow" type="button"></div>
            <div id="blue" class="square blue" type="button"></div>
        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="js/game.js"></script>
    </body>
</html>
